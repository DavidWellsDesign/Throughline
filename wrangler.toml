# Cloudflare Pages configuration.
#
# The site is plain static files in the repo root, so there is no build step —
# `pages_build_output_dir = "."` tells Wrangler to upload the directory as-is.
# `functions/` is picked up automatically as Pages Functions and is not served
# as static content.
name = "throughline-site"
compatibility_date = "2026-09-05"
pages_build_output_dir = "."

# Licence keys, the email→keys index, and webhook idempotency markers.
# Create the namespaces first (see README), then paste the ids here:
#   npx wrangler kv namespace create LICENCES
#   npx wrangler kv namespace create LICENCES --preview
[[kv_namespaces]]
binding = "LICENCES"
id = "REPLACE_WITH_PRODUCTION_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_NAMESPACE_ID"
